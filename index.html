<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Personal OS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="description" content="A personal command center: today's mission, daily standards, and the long game.">
<meta name="theme-color" content="#08090B">
<meta name="color-scheme" content="dark">

<!-- iOS home-screen app -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Personal OS">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="manifest" href="manifest.webmanifest">

<link rel="stylesheet" href="css/app.css">
</head>
<body>

<main id="screen" role="main"></main>

<button id="fab" aria-label="Capture a thought">＋</button>

<nav id="nav" aria-label="Primary">
  <button data-nav="today" aria-current="page"><span class="ic">🎯</span>Today</button>
  <button data-nav="plan"><span class="ic">📅</span>Plan</button>
  <button data-nav="money"><span class="ic">💰</span>Money</button>
  <button data-nav="goals"><span class="ic">🏔️</span>Goals</button>
  <button data-nav="more"><span class="ic">📊</span>More</button>
</nav>

<div id="sheets" aria-live="polite"></div>
<div id="focus"></div>
<div id="toast" role="status"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
