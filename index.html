<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Personal OS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#04050A">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Personal OS">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<canvas id="sky"></canvas>

<button id="menu" aria-label="More">
  <span></span><span></span><span></span>
</button>

<div id="sheet"></div>
<div id="toast" role="status"></div>

<script>
// Build sentinel — index.html is always fetched fresh, app.js reports the build
// it was compiled against. A mismatch means stale modules: clear and reload once.
// BUMP THIS AND __POS_READY IN js/app.js TOGETHER ON EVERY RELEASE.
window.__POS_BUILD = 5;
addEventListener('load', function () {
  setTimeout(function () {
    if (window.__POS_READY === window.__POS_BUILD) return;
    if (sessionStorage.getItem('pos-healing')) return;
    sessionStorage.setItem('pos-healing', '1');
    var done = function () { location.reload(); };
    Promise.resolve()
      .then(function () { return caches ? caches.keys().then(function (k) {
        return Promise.all(k.map(function (n) { return caches.delete(n); })); }) : null; })
      .then(function () { return navigator.serviceWorker
        ? navigator.serviceWorker.getRegistrations().then(function (rs) {
            return Promise.all(rs.map(function (r) { return r.unregister(); })); }) : null; })
      .then(done, done);
  }, 2000);
});
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
